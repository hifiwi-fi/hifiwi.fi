name: Version and Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Version type
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
        required: true
      new-version:
        description: Custom version (only used when version type is custom)
        required: false

env:
  FORCE_COLOR: 3

permissions:
  contents: write

concurrency:
  group: hifiwifi-release
  cancel-in-progress: true

jobs:
  version_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm install
      - run: npm test
      - name: Version and release
        id: npm-bump
        uses: bcomnes/npm-bump@v3.0.2
        with:
          git-email: bcomnes@gmail.com
          git-username: ${{ github.actor }}
          version-type: ${{ github.event.inputs['version-type'] }}
          new-version: ${{ github.event.inputs['new-version'] }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-cmd: npm run release
